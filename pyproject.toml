[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.4.0"
description = "Clip, edit and save videos locally from your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "questionary>=2", "httpx>=0.27", "python-dotenv>=1", "yt-dlp[default]>=2025.11", "faster-whisper>=1.2.1,<2", "av>=11,<19", "opencv-python-headless>=4.9,<5", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
tts = ["pyttsx3>=2.90"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.package-data]
clipforge = ["fonts/*"]

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
